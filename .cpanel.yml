# this host is for design review / client approval, not production.
#
# If you still use cPanel Git Version Control, clone OUTSIDE public_html.
# Spaces only (no tabs).
deployment:
  tasks:
    - export DEPLOYPATH=/home/buselmei/public_html/staging.skinprotocolrx.com
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp -RF dist/. "$DEPLOYPATH"/
