---
# GreenGeeks / cPanel Git Version Control deploy.
# 1. Clone this repo outside the web root (Git Version Control → Create).
# 2. Replace DEPLOYPATH with the subdomain document root for
#    skinprotocolrx.buselmeier.com (cPanel → Domains → document root).
# 3. Pull or Deploy → Update from Remote → Deploy HEAD Commit.
#
# Spaces only (no tabs). Path must exist before deploy.
deployment:
  tasks:
    - export DEPLOYPATH=/home/REPLACE_CPANEL_USER/skinprotocolrx.buselmeier.com
    - /bin/cp -RF dist/. $DEPLOYPATH
